function ChatTab(){
  const [messages,setMessages]=useState([]);
  const [text,setText]=useState("");
  const [sender,setSender]=useState(localStorage.getItem("chat_name")||"");
  const [nameSet,setNameSet]=useState(!!localStorage.getItem("chat_name"));
  const [sending,setSending]=useState(false);
  const bottomRef=useRef(null);
  useEffect(()=>{loadMsgs();const i=setInterval(loadMsgs,5000);return()=>clearInterval(i);},[]);
  useEffect(()=>{if(bottomRef.current)bottomRef.current.scrollIntoView({behavior:"smooth"});},[messages]);
  async function loadMsgs(){const r=await dbGet("messages","order=created_at.asc&limit=100");if(Array.isArray(r))setMessages(r);}
  async function send(){if(!text.trim()||!sender)return;setSending(true);await dbPost("messages",{sender,text});setText("");await loadMsgs();setSending(false);}
  function setName(n){setSender(n);localStorage.setItem("chat_name",n);setNameSet(true);}
  if(!nameSet)return(
    <div style={{padding:24,maxWidth:400,margin:"40px auto"}}>
      <div style={S.card}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:16}}>מה השם שלך?</div>
        <input style={S.inp} placeholder="שם..." value={sender} onChange={e=>setSender(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sender.trim()&&setName(sender.trim())}/>
        <button style={{...S.btn,width:"100%"}} onClick={()=>sender.trim()&&setName(sender.trim())}>כניסה לצ'אט</button>
      </div>
    </div>
  );
  return(
    <div style={{display:"flex",flexDirection:"column",height:"calc(100vh - 180px)"}}>
      <div style={{flex:1,overflowY:"auto",padding:"12px 16px"}}>
        {messages.length===0&&<div style={{textAlign:"center",color:"#9ca3af",padding:40}}>אין הודעות עדיין</div>}
        {messages.map(m=>{
          const isMe=m.sender===sender;
          const time=new Date(m.created_at).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"});
          return(
            <div key={m.id} style={{display:"flex",justifyContent:isMe?"flex-start":"flex-end",marginBottom:10}}>
              <div style={{maxWidth:"75%"}}>
                {!isMe&&<div style={{fontSize:10,color:"#6b7280",marginBottom:2,textAlign:"right"}}>{m.sender}</div>}
                <div style={{background:isMe?"linear-gradient(135deg,#6366f1,#a855f7)":"#fff",color:isMe?"#fff":"#1a1a2e",padding:"10px 14px",borderRadius:isMe?"14px 14px 4px 14px":"14px 14px 14px 4px",fontSize:16,boxShadow:"0 1px 3px #0001",border:isMe?"none":"1px solid #e5e7f0"}}>{m.text}</div>
                <div style={{fontSize:10,color:"#9ca3af",marginTop:2,textAlign:isMe?"left":"right"}}>{time}</div>
              </div>
            </div>
          );
        })}
        <div ref={bottomRef}/>
      </div>
      <div style={{padding:"8px 16px",background:"#fff",borderTop:"1px solid #e5e7f0",display:"flex",gap:8,alignItems:"center"}}>
        <input style={{flex:1,background:"#f0f2f8",border:"1px solid #dde1f0",borderRadius:20,padding:"9px 14px",color:"#1a1a2e",fontSize:14,outline:"none"}} placeholder="כתוב הודעה..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
        <button onClick={send} disabled={sending||!text.trim()} style={{width:40,height:40,borderRadius:"50%",border:"none",background:"linear-gradient(135deg,#6366f1,#a855f7)",color:"#fff",cursor:"pointer",fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>➤</button>
      </div>
    </div>
  );
}

function TeamTasksTab(){
  const [tasks,setTasks]=useState([]);
  const [text,setText]=useState("");
  const [assignee,setAssignee]=useState("");
  const [dueDate,setDueDate]=useState("");
  const [saving,setSaving]=useState(false);
  const [filter,setFilter]=useState("הכל");
  useEffect(()=>{loadTasks();},[]);
  async function loadTasks(){const r=await dbGet("team_tasks","order=created_at.desc");if(Array.isArray(r))setTasks(r);}
  async function addTask(){if(!text.trim())return;setSaving(true);const res=await dbPost("team_tasks",{text,assignee:assignee||null,due_date:dueDate||null,done:false});if(Array.isArray(res)&&res[0])setTasks(ts=>[res[0],...ts]);setText("");setAssignee("");setDueDate("");setSaving(false);}
  async function toggle(id,done){setTasks(ts=>ts.map(t=>t.id===id?{...t,done:!done}:t));await dbPatch("team_tasks",id,{done:!done});}
  async function del(id){setTasks(ts=>ts.filter(t=>t.id!==id));await dbDelete("team_tasks",id);}
  const filtered=tasks.filter(t=>filter==="הכל"||(filter==="פתוח"&&!t.done)||(filter==="הושלם"&&t.done));
  const urgent=tasks.filter(t=>!t.done&&t.due_date&&t.due_date<=today).length;
  return(
    <div style={{padding:"14px 16px 80px",maxWidth:700,margin:"0 auto"}}>
      <div style={{...S.card,marginBottom:16}}>
        <div style={{fontSize:13,fontWeight:700,marginBottom:12}}>משימה חדשה לצוות</div>
        <input style={S.inp} placeholder="תיאור המשימה..." value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTask()}/>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input style={{flex:1,minWidth:100,...S.inp,marginBottom:0}} placeholder="אחראי..." value={assignee} onChange={e=>setAssignee(e.target.value)}/>
          <input type="date" style={{...S.inp,marginBottom:0,flex:1}} value={dueDate} onChange={e=>setDueDate(e.target.value)}/>
          <button style={S.btn} onClick={addTask} disabled={saving}>{saving?"...":"+ הוסף"}</button>
        </div>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:14,alignItems:"center"}}>
        {["הכל","פתוח","הושלם"].map(f=>(<button key={f} onClick={()=>setFilter(f)} style={{padding:"7px 14px",borderRadius:8,border:filter===f?"none":"1px solid #dde1f0",background:filter===f?"linear-gradient(135deg,#6366f1,#a855f7)":"#fff",color:filter===f?"#fff":"#6b7280",cursor:"pointer",fontSize:12,fontWeight:filter===f?600:400}}>{f}</button>))}
        {urgent>0&&<span style={{background:"#fee2e2",color:"#ef4444",borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:600}}>⚠️ {urgent} דחוף</span>}
      </div>
      {filtered.length===0&&<div style={{textAlign:"center",color:"#9ca3af",padding:40}}>אין משימות</div>}
      {filtered.map(t=>{
        const isUrgent=!t.done&&t.due_date&&t.due_date<=today;
        return(
          <div key={t.id} style={{...S.card,opacity:t.done?0.6:1,border:isUrgent?"1px solid #fca5a5":S.card.border}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
              <div onClick={()=>toggle(t.id,t.done)} style={{width:22,height:22,borderRadius:6,border:t.done?"none":"2px solid #6366f1",background:t.done?"linear-gradient(135deg,#6366f1,#a855f7)":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{t.done&&<span style={{color:"#fff",fontSize:12}}>✓</span>}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600,textDecoration:t.done?"line-through":"none",color:t.done?"#9ca3af":"#1a1a2e"}}>{t.text}</div>
                <div style={{display:"flex",gap:10,marginTop:4,flexWrap:"wrap"}}>
                  {t.assignee&&<span style={{fontSize:11,color:"#6366f1"}}>👤 {t.assignee}</span>}
                  {t.due_date&&<span style={{fontSize:11,color:isUrgent?"#ef4444":"#6b7280"}}>📅 {t.due_date}</span>}
                </div>
              </div>
              <button onClick={()=>del(t.id)} style={{background:"none",border:"none",color:"#d1d5db",cursor:"pointer",fontSize:16}}>✕</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function PatientsTab(){

  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [filterStage,setFilterStage]=useState("הכל");
  const [search,setSearch]=useState("");
  const [formData,setFormData]=useState(null);
  const [nt,setNt]=useState({text:"",cat:"רפואי",date:"",assignee:""});
  const [saving,setSaving]=useState(false);
  const [confirmDelete,setConfirmDelete]=useState(null);
  useEffect(()=>{loadAll();},[]);
  async function loadAll(){setLoading(true);const [ps,ts]=await Promise.all([dbGet("patients","order=id.desc"),dbGet("tasks","order=id.asc")]);setPatients(Array.isArray(ps)?ps:[]);setTasks(Array.isArray(ts)?ts:[]);setLoading(false);}
  const patient=patients.find(p=>p.id===selected);
  const ptasks=tasks.filter(t=>t.patient_id===selected);
  const filtered=patients.filter(p=>(filterStage==="הכל"||p.stage===filterStage)&&p.name.includes(search));
  async function savePatient(f){setSaving(true);const body=cleanPatient(f);if(f.id){await dbPatch("patients",f.id,body);setPatients(ps=>ps.map(p=>p.id===f.id?{...p,...body}:p));}else{const res=await dbPost("patients",body);if(Array.isArray(res)&&res[0])setPatients(ps=>[res[0],...ps]);}setFormData(null);setSaving(false);}
  async function deletePatient(id){await dbDelete("patients",id);setPatients(ps=>ps.filter(p=>p.id!==id));setTasks(ts=>ts.filter(t=>t.patient_id!==id));setConfirmDelete(null);setSelected(null);}
  async function toggleTask(id,done){setTasks(ts=>ts.map(t=>t.id===id?{...t,done:!done}:t));await dbPatch("tasks",id,{done:!done});}
  async function addTask(){if(!nt.text.trim()||!selected)return;setSaving(true);const res=await dbPost("tasks",{patient_id:selected,text:nt.text,cat:nt.cat,date:nt.date||null,done:false,assignee:nt.assignee||null});if(Array.isArray(res)&&res[0])setTasks(ts=>[...ts,res[0]]);setNt({text:"",cat:"רפואי",date:"",assignee:""});setSaving(false);}

            {p.kupat_holim&&<div style={{fontSize:11,color:"#6b7280"}}>🏥 {p.kupat_holim}</div>}
            {p.car_type&&<div style={{fontSize:11,color:"#6b7280"}}>🚗 {p.car_type}</div>}
            {p.food_frequency&&<div style={{fontSize:11,color:"#6b7280"}}>🍽️ {p.food_frequency}</div>}
          </div>
          {p.medical_notes&&<div style={{fontSize:10,color:"#dc2626",background:"#fee2e2",borderRadius:5,padding:"3px 7px",marginBottom:5}}>⚠️ {p.medical_notes.slice(0,60)}{p.medical_notes.length>60?"...":""}</div>}
          {urgent&&<span style={{background:"#fee2e2",color:"#ef4444",borderRadius:6,padding:"3px 8px",fontSize:10,fontWeight:600,display:"inline-block",marginBottom:5}}>⚠️ משימה דחופה</span>}
          {pt.length>0&&<div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:6,marginBottom:3,fontSize:10,color:"#9ca3af"}}><span>משימות</span><span>{done}/{pt.length}</span></div>
            <div style={{background:"#e5e7f0",borderRadius:6,height:4}}><div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#6366f1,#a855f7)",borderRadius:6}}/></div>
          </div>}
        </div>);
      })}
    </div>
    {formData&&<div style={{position:"fixed",inset:0,background:"#00000060",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}} onClick={e=>e.target===e.currentTarget&&setFormData(null)}><PatientForm init={formData} onSave={savePatient} onCancel={()=>setFormData(null)} saving={saving}/></div>}
  </div>);
}

function App(){
  const [tab,setTab]=useState("patients");
  const titles={patients:"מעקב מטופלים",team:"משימות צוות",chat:"צ'אט פנימי"};
  const subs={patients:"ניהול תומך מטופלי כתף",team:"משימות משותפות לצוות",chat:"תקשורת פנים-ארגונית"};
  return(<div style={{minHeight:"100vh",background:"#f0f2f8"}}>
    <AppHeader title={titles[tab]} subtitle={subs[tab]}/>
    {tab==="patients"&&<PatientsTab/>}
    {tab==="team"&&<TeamTasksTab/>}
    {tab==="chat"&&<ChatTab/>}
    <NavBar tab={tab} setTab={setTab}/>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
