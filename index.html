const H={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":`Bearer ${SB_KEY}`,"Prefer":"return=representation"};
async function dbGet(t,q=""){const r=await fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:H});return r.json();}
async function dbPost(t,b){const r=await fetch(`${SB_URL}/rest/v1/${t}`,{method:"POST",headers:H,body:JSON.stringify(b)});return r.json();}
async function dbPatch(t,id,b){await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:"PATCH",headers:H,body:JSON.stringify(b)});}
async function dbDelete(t,id){await fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:"DELETE",headers:H});}

function App(){
  const [patients,setPatients]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [filterStage,setFilterStage]=useState("הכל");
  const [search,setSearch]=useState("");
  const [formData,setFormData]=useState(null);
  const [nt,setNt]=useState({text:"",cat:"רפואי",date:"",assignee:""});
  const [saving,setSaving]=useState(false);
  const [confirmDelete,setConfirmDelete]=useState(null);

  useEffect(()=>{loadAll();},[]);

  async function loadAll(){
    setLoading(true);
    const [ps,ts]=await Promise.all([dbGet("patients","order=id.desc"),dbGet("tasks","order=id.asc")]);
    setPatients(Array.isArray(ps)?ps:[]);
    setTasks(Array.isArray(ts)?ts:[]);
    setLoading(false);
  }

  const patient=patients.find(p=>p.id===selected);
  const ptasks=tasks.filter(t=>t.patient_id===selected);
  const filtered=patients.filter(p=>(filterStage==="הכל"||p.stage===filterStage)&&p.name.includes(search));
  const urgentCount=tasks.filter(t=>!t.done&&t.date&&t.date<=today).length;

  async function savePatient(f){
    setSaving(true);
    const body=cleanPatient(f);
    if(f.id){await dbPatch("patients",f.id,body);setPatients(ps=>ps.map(p=>p.id===f.id?{...p,...body}:p));}
    else{const res=await dbPost("patients",body);if(Array.isArray(res)&&res[0])setPatients(ps=>[res[0],...ps]);}
    setFormData(null);setSaving(false);
  }

  async function deletePatient(id){
    await dbDelete("patients",id);
    setPatients(ps=>ps.filter(p=>p.id!==id));
    setTasks(ts=>ts.filter(t=>t.patient_id!==id));
    setConfirmDelete(null);setSelected(null);
  }

  async function toggleTask(id,done){setTasks(ts=>ts.map(t=>t.id===id?{...t,done:!done}:t));await dbPatch("tasks",id,{done:!done});}
  async function addTask(){if(!nt.text.trim()||!selected)return;setSaving(true);const res=await dbPost("tasks",{patient_id:selected,text:nt.text,cat:nt.cat,date:nt.date||null,done:false,assignee:nt.assignee||null});if(Array.isArray(res)&&res[0])setTasks(ts=>[...ts,res[0]]);setNt({text:"",cat:"רפואי",date:"",assignee:""});setSaving(false);}
  async function delTask(id){setTasks(ts=>ts.filter(t=>t.id!==id));await dbDelete("tasks",id);}

  if(loading)return(<div style={{minHeight:"100vh",background:"#f0f2f8",display:"flex",alignItems:"center",justifyContent:"center"}}><div style={{textAlign:"center",color:"#6b7280"}}><div style={{fontSize:32,marginBottom:12}}>🩺</div><div>טוען...</div></div></div>);

  if(selected&&patient){
    const done=ptasks.filter(t=>t.done).length;
    const pct=ptasks.length>0?Math.round(done/ptasks.length*100):0;
    const isKosher=patient.kosher==="true"||patient.kosher===true;
    return(<div style={{minHeight:"100vh",background:"#f0f2f8"}}><Header patients={patients} tasks={tasks}/>
      <div style={{padding:16,maxWidth:700,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <button onClick={()=>setSelected(null)} style={{background:"none",border:"none",color:"#6366f1",cursor:"pointer",fontSize:14,padding:0,fontWeight:600}}>→ חזרה</button>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setFormData({...patient})} style={{...S.btn,padding:"8px 14px",fontSize:12}}>✏️ עריכה</button>
            <button onClick={()=>setConfirmDelete(patient.id)} style={{padding:"8px 14px",borderRadius:10,border:"none",background:"#fee2e2",color:"#ef4444",cursor:"pointer",fontSize:12,fontWeight:600}}>🗑️ מחיקה</button>
          </div>
        </div>

        <div style={{...S.card,marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <div style={{width:52,height:52,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#a855f7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:700,color:"#fff",flexShrink:0}}>{patient.name[0]}</div>
            <div>
              <div style={{fontSize:20,fontWeight:800,color:"#1a1a2e"}}>{patient.name}</div>
              <div style={{display:"flex",gap:6,marginTop:4,flexWrap:"wrap",alignItems:"center"}}>
                <span style={S.badge(patient.stage)}>{patient.stage}</span>
                {patient.age&&<span style={{fontSize:11,color:"#6b7280"}}>גיל {patient.age}</span>}
                {isKosher&&<span style={{fontSize:10,background:"#d1fae5",color:"#059669",border:"1px solid #a7f3d0",borderRadius:10,padding:"2px 7px"}}>כשר ✓</span>}
              </div>
            </div>
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <div style={S.section}>
            <div style={S.sTitle}>טיפול רפואי</div>
            <div style={S.row}><span>💊</span><span>{patient.treatment}</span></div>
            {patient.doctor_israel&&<div style={S.row}><span>👨‍⚕️</span><span>ארץ: {patient.doctor_israel}</span></div>}
            {patient.doctor_austria&&<div style={S.row}><span>👨‍⚕️</span><span>אוסטריה: {patient.doctor_austria}</span></div>}
            <div style={S.row}><span>▶️</span><span>{patient.treatment_start||"לא נקבע"}</span></div>
            <div style={S.row}><span>⏹️</span><span>{patient.treatment_end||"לא נקבע"}</span></div>
            {patient.medical_notes&&<div style={{fontSize:11,color:"#dc2626",background:"#fee2e2",borderRadius:6,padding:"6px 8px",marginTop:4}}><span>⚠️ </span>{patient.medical_notes}</div>}
          </div>
          <div style={S.section}>
            <div style={S.sTitle}>פרטים</div>
            <div style={S.row}><span>🏥</span><span>{patient.kupat_holim||"לא צוין"}</span></div>
            <div style={S.row}><span>🗣️</span><span>{patient.languages||"לא צוין"}</span></div>
            {patient.coordinator&&<div style={S.row}><span>👤</span><span>{patient.coordinator}</span></div>}
            {patient.notes&&<div style={S.row}><span>📝</span><span>{patient.notes}</span></div>}
          </div>
        </div>

        <div style={S.section}>
          <div style={S.sTitle}>אוכל</div>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            <div style={S.row}><span>🍽️</span><span>{patient.food||"לא צוין"}</span></div>
            {patient.food_frequency&&<div style={S.row}><span>📅</span><span>{patient.food_frequency}</span></div>}
            {patient.food_allergies&&<div style={S.row}><span>⚠️</span><span>רגישויות: {patient.food_allergies}</span></div>}
            <div style={S.row}><span>{isKosher?"✅":"❌"}</span><span>כשר</span></div>
          </div>
        </div>

        {(patient.contact_name||patient.contact2_name)&&<div style={S.section}>
          <div style={S.sTitle}>אנשי קשר</div>
          {patient.contact_name&&<div style={{marginBottom:patient.contact2_name?12:0}}>
            <div style={{fontSize:11,color:"#6366f1",fontWeight:600,marginBottom:4}}>איש קשר ראשון {patient.contact1_relation?`(${patient.contact1_relation})`:""}</div>
            <div style={S.row}><span>👤</span><span>{patient.contact_name}</span></div>
            {patient.contact_phone&&<div style={S.row}><span>📞</span><a href={`tel:${patient.contact_phone}`} style={{color:"#6366f1"}}>{patient.contact_phone}</a></div>}
            {patient.contact_whatsapp&&<div style={S.row}><span>💬</span><a href={`https://wa.me/${patient.contact_whatsapp}`} style={{color:"#25d366"}}>{patient.contact_whatsapp}</a></div>}
            {patient.contact_email&&<div style={S.row}><span>✉️</span><a href={`mailto:${patient.contact_email}`} style={{color:"#6366f1"}}>{patient.contact_email}</a></div>}
          </div>}
          {patient.contact2_name&&<div>
            <div style={{fontSize:11,color:"#6366f1",fontWeight:600,marginBottom:4}}>איש קשר שני {patient.contact2_relation?`(${patient.contact2_relation})`:""}</div>
            <div style={S.row}><span>👤</span><span>{patient.contact2_name}</span></div>
            {patient.contact2_phone&&<div style={S.row}><span>📞</span><a href={`tel:${patient.contact2_phone}`} style={{color:"#6366f1"}}>{patient.contact2_phone}</a></div>}
            {patient.contact2_whatsapp&&<div style={S.row}><span>💬</span><a href={`https://wa.me/${patient.contact2_whatsapp}`} style={{color:"#25d366"}}>{patient.contact2_whatsapp}</a></div>}
            {patient.contact2_email&&<div style={S.row}><span>✉️</span><a href={`mailto:${patient.contact2_email}`} style={{color:"#6366f1"}}>{patient.contact2_email}</a></div>}
          </div>}
        </div>}

        <div style={S.section}>
          <div style={S.sTitle}>לוגיסטיקה</div>
          <div style={S.row}><span>🏠</span><span>{patient.housing||"לא צוין"}</span></div>
          <div style={S.row}><span>🚗</span><span>{patient.car||"לא צוין"}</span></div>
        </div>

        <div style={S.section}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontWeight:700,fontSize:14,color:"#1a1a2e"}}>משימות</span>
            <span style={{fontSize:11,color:"#6366f1"}}>{done}/{ptasks.length} ({pct}%)</span>
          </div>
          <div style={{background:"#e5e7f0",borderRadius:6,height:6,marginBottom:12}}>
            <div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#6366f1,#a855f7)",borderRadius:6}}/>
          </div>
          {ptasks.length===0&&<div style={{textAlign:"center",color:"#9ca3af",padding:10,fontSize:12}}>אין משימות עדיין</div>}
          {ptasks.map(t=>(<div key={t.id} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 0",borderBottom:"1px solid #f3f4f6",opacity:t.done?0.5:1}}>
            <div onClick={()=>toggleTask(t.id,t.done)} style={{width:20,height:20,borderRadius:5,border:t.done?"none":"2px solid #6366f1",background:t.done?"linear-gradient(135deg,#6366f1,#a855f7)":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{t.done&&<span style={{color:"#fff",fontSize:10}}>✓</span>}</div>
            <span style={{fontSize:13,flexShrink:0}}>{CICO[t.cat]||"📋"}</span>
            <div style={{flex:1}}>
              <div style={{fontSize:13,textDecoration:t.done?"line-through":"none",color:t.done?"#9ca3af":"#1a1a2e"}}>{t.text}</div>
              <div style={{display:"flex",gap:8,marginTop:2,flexWrap:"wrap"}}>
                {t.date&&<span style={{fontSize:10,color:"#9ca3af"}}>📅 {t.date}</span>}
                {t.assignee&&<span style={{fontSize:10,color:"#6366f1"}}>👤 {t.assignee}</span>}
              </div>
            </div>
            <button onClick={()=>delTask(t.id)} style={{background:"none",border:"none",color:"#d1d5db",cursor:"pointer",fontSize:14}}>✕</button>
          </div>))}
          <div style={{marginTop:12,background:"#f8f9ff",borderRadius:10,padding:12,border:"1px solid #e5e7f0"}}>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:8,fontWeight:600}}>משימה חדשה</div>
            <input style={{...S.inp,marginBottom:8}} placeholder="תיאור המשימה..." value={nt.text} onChange={e=>setNt(n=>({...n,text:e.target.value}))} onKeyDown={e=>e.key==="Enter"&&addTask()}/>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <select style={{background:"#fff",border:"1px solid #dde1f0",borderRadius:7,padding:"7px 8px",color:"#1a1a2e",fontSize:11,outline:"none"}} value={nt.cat} onChange={e=>setNt(n=>({...n,cat:e.target.value}))}>{CATS.map(c=><option key={c}>{c}</option>)}</select>
              <input style={{flex:1,minWidth:90,background:"#fff",border:"1px solid #dde1f0",borderRadius:7,padding:"7px 8px",color:"#1a1a2e",fontSize:11,outline:"none"}} placeholder="מי מטפל?" value={nt.assignee} onChange={e=>setNt(n=>({...n,assignee:e.target.value}))}/>
              <input type="date" style={{background:"#fff",border:"1px solid #dde1f0",borderRadius:7,padding:"7px 8px",color:"#1a1a2e",fontSize:11,outline:"none"}} value={nt.date} onChange={e=>setNt(n=>({...n,date:e.target.value}))}/>
              <button style={S.btn} onClick={addTask} disabled={saving}>{saving?"...":"+ הוסף"}</button>
            </div>
          </div>
        </div>
      </div>
      {formData&&<div style={{position:"fixed",inset:0,background:"#00000060",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}} onClick={e=>e.target===e.currentTarget&&setFormData(null)}><PatientForm init={formData} onSave={savePatient} onCancel={()=>setFormData(null)} saving={saving}/></div>}
      {confirmDelete&&<div style={{position:"fixed",inset:0,background:"#00000060",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
        <div style={{background:"#fff",border:"1px solid #fee2e2",borderRadius:16,padding:28,maxWidth:340,width:"100%",textAlign:"center",boxShadow:"0 8px 32px #0002"}}>
          <div style={{fontSize:32,marginBottom:12}}>🗑️</div>
          <div style={{fontSize:16,fontWeight:700,marginBottom:8,color:"#1a1a2e"}}>מחיקת מטופל</div>
          <div style={{fontSize:13,color:"#6b7280",marginBottom:20}}>פעולה זו תמחק את המטופל וכל המשימות שלו. לא ניתן לשחזר.</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setConfirmDelete(null)} style={{flex:1,padding:"10px",borderRadius:9,border:"1px solid #dde1f0",background:"#fff",color:"#6b7280",cursor:"pointer",fontSize:13}}>ביטול</button>
            <button onClick={()=>deletePatient(confirmDelete)} style={{flex:1,padding:"10px",borderRadius:9,border:"none",background:"#ef4444",color:"#fff",cursor:"pointer",fontSize:13,fontWeight:700}}>מחק</button>
          </div>
        </div>
      </div>}
    </div>);
  }

  return(<div style={{minHeight:"100vh",background:"#f0f2f8"}}><Header patients={patients} tasks={tasks}/>
    <div style={{padding:"14px 20px",maxWidth:700,margin:"0 auto"}}>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
        <input style={{flex:1,minWidth:150,background:"#fff",border:"1px solid #dde1f0",borderRadius:10,padding:"9px 14px",color:"#1a1a2e",fontSize:13,outline:"none",boxShadow:"0 1px 3px #0001"}} placeholder="🔍 חיפוש..." value={search} onChange={e=>setSearch(e.target.value)}/>
        {["הכל",...STAGES].map(s=>(<button key={s} onClick={()=>setFilterStage(s)} style={{padding:"8px 12px",borderRadius:8,border:filterStage===s?"none":"1px solid #dde1f0",background:filterStage===s?"linear-gradient(135deg,#6366f1,#a855f7)":"#fff",color:filterStage===s?"#fff":"#6b7280",cursor:"pointer",fontSize:11,fontWeight:filterStage===s?600:400,boxShadow:filterStage===s?"none":"0 1px 3px #0001"}}>{s}</button>))}
        <button style={S.btn} onClick={()=>setFormData({...EMPTY})}>+ מטופל חדש</button>
      </div>
      {filtered.length===0&&<div style={{textAlign:"center",color:"#9ca3af",padding:40,fontSize:13}}>אין מטופלים</div>}
      {filtered.map(p=>{
        const pt=tasks.filter(t=>t.patient_id===p.id);
        const done=pt.filter(t=>t.done).length;
        const pct=pt.length>0?Math.round(done/pt.length*100):0;
        const urgent=pt.some(t=>!t.done&&t.date&&t.date<=today);
        const isKosher=p.kosher==="true"||p.kosher===true;
        return(<div key={p.id} style={{...S.card,cursor:"pointer"}} onClick={()=>setSelected(p.id)}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:40,height:40,borderRadius:"50%",background:"linear-gradient(135deg,#6366f1,#a855f7)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700,color:"#fff",flexShrink:0}}>{p.name[0]}</div>
              <div>
                <div style={{fontSize:15,fontWeight:700,color:"#1a1a2e"}}>{p.name}</div>
                <div style={{fontSize:11,color:"#6b7280"}}>{p.age?`גיל ${p.age} · `:""}{p.treatment}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}}>
              {isKosher&&<span style={{fontSize:9,background:"#d1fae5",color:"#059669",borderRadius:8,padding:"2px 5px"}}>כשר</span>}
              <span style={S.badge(p.stage)}>{p.stage}</span>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:3,marginBottom:5}}>
            {p.coordinator&&<div style={{fontSize:11,color:"#6b7280"}}>👤 {p.coordinator}</div>}
            {p.kupat_holim&&<div style={{fontSize:11,color:"#6b7280"}}>🏥 {p.kupat_holim}</div>}
            {p.doctor_israel&&<div style={{fontSize:11,color:"#6b7280"}}>👨‍⚕️ {p.doctor_israel}</div>}
            {p.food_frequency&&<div style={{fontSize:11,color:"#6b7280"}}>🍽️ {p.food_frequency}</div>}
          </div>
          {p.medical_notes&&<div style={{fontSize:10,color:"#dc2626",background:"#fee2e2",borderRadius:5,padding:"3px 7px",marginBottom:5}}>⚠️ {p.medical_notes.slice(0,60)}{p.medical_notes.length>60?"...":""}</div>}
          {urgent&&<span style={{background:"#fee2e2",color:"#ef4444",borderRadius:6,padding:"3px 8px",fontSize:10,fontWeight:600,display:"inline-block",marginBottom:5}}>⚠️ משימה דחופה</span>}
          {pt.length>0&&<div>
            <div style={{display:"flex",justifyContent:"space-between",marginTop:6,marginBottom:3,fontSize:10,color:"#9ca3af"}}><span>משימות</span><span>{done}/{pt.length}</span></div>
            <div style={{background:"#e5e7f0",borderRadius:6,height:4}}><div style={{height:"100%",width:`${pct}%`,background:"linear-gradient(90deg,#6366f1,#a855f7)",borderRadius:6}}/></div>
          </div>}
        </div>);
      })}
    </div>
    {formData&&<div style={{position:"fixed",inset:0,background:"#00000060",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}} onClick={e=>e.target===e.currentTarget&&setFormData(null)}><PatientForm init={formData} onSave={savePatient} onCancel={()=>setFormData(null)} saving={saving}/></div>}
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
